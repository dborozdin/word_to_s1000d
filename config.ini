[processing]
; Whether to split the source file into multiple data modules
; True - each section/component gets its own module
; False - combine all content into a single module
split_into_modules = False

; Input directory for source documents
input_dir = doc_source

; Processing mode:
;   - If docx_file is set: single-file mode (process that one file)
;   - If docx_file is commented out: batch mode (process all folders in input_dir)
;docx_file = 029.00.00 Перечень принятых сокращений.docx

; Output directory for generated files
output_dir = ./tg_web/suites/66935

; Источник определения элементов для comparison app
; hybrid  — PDF-блоки (границы) + DOCX-анализ (типы), матчинг по тексту
; docx_only — только DOCX-анализ (текущее поведение)
element_source = hybrid

[llm]
; Включить LLM-ассистированное распознавание структуры документа
; При enabled = True используется Ollama для классификации неоднозначных элементов
enabled = False

; URL и порт Ollama сервера (может быть локальный или удалённый сервер в сети)
ollama_url = http://localhost:11434

; Модель для задач классификации структуры (работа с естественным языком)
; Рекомендуемые модели: gemma3:4b-it-qat, llama3.2:3b, mistral:7b
ollama_model = gemma3:4b-it-qat

; Размер батча (параграфов за один запрос к LLM)
batch_size = 20

; Порог уверенности (0.0-1.0)
; Ниже этого значения используются эвристики вместо результата LLM
confidence_threshold = 0.7

; Кэширование ответов LLM для повторных запусков
cache_enabled = True
cache_dir = .llm_cache

[verification]
; Максимум циклов форматирования согласно эталону (0 = только визуальный просмотр)
max_cycles = 3

; Порог сходимости (0.0-1.0). При score >= threshold цикл останавливается
convergence_threshold = 0.95
