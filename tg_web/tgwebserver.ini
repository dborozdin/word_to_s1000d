[listener]
; host=192.168.0.100
;port=8091
port=8082
minThreads=4
maxThreads=100
cleanupInterval=60000
readTimeout=60000
maxRequestSize=16000
maxMultiPartSize=10000000

[logging]
uselogfile=0
fileName=../logs/qtwebserver.log
minLevel=1
bufferSize=100
maxSize=1000000
maxBackups=2
timestampFormat=dd.MM.yyyy hh:mm:ss.zzz
msgFormat={timestamp} {typeNr} {type} {thread} {msg}
; QT5 supports: msgFormat={timestamp} {typeNr} {type} {thread} {msg}\n  in {file} line {line} function {function}

[docroot]
path=dist
encoding=UTF-8
maxAge=60000
cacheTime=60000
cacheSize=1000000
maxCachedFileSize=65536

[api]
apipath=/matr/
suites=suites

[auth]
enabled=false
users=users
cookieName=sessionId
cookiePath=/
;cookieComment=
;cookieDomain=
;expirationTime=3600000

[http-headers]
header1="Access-Control-Allow-Origin:http://localhost:5175"
header2="Access-Control-Allow-Methods:GET, POST, OPTIONS"
header3="Access-Control-Allow-Headers:Content-Type, Authorization"
header4="Access-Control-Allow-Credentials:true"
